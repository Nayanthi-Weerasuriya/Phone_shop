{% extends 'store/base.html' %}

{% block content %}
<main class="container py-5">
  <div class="row justify-content-center"><div class="col-md-7 col-lg-5">
    <div class="card shadow-sm"><div class="card-body p-4">
      <h1 class="h3 mb-4 text-center">Sign in</h1>
      <form method="post" action="{% url 'user_accounts:login_user' %}">
        {% csrf_token %}
        <div class="mb-3"><label class="form-label" for="username">Username</label><input id="username" class="form-control" name="username" required autofocus></div>
        <div class="mb-4"><label class="form-label" for="password">Password</label><input id="password" class="form-control" type="password" name="password" required></div>
        <div class="d-grid gap-2"><button class="btn btn-primary" type="submit">Log in</button><a class="btn btn-outline-secondary" href="{% url 'user_accounts:register_user' %}">Create an account</a></div>
      </form>
    </div></div>
  </div></div>
</main>
{% endblock %}
