{% extends 'store/base.html' %}

{% block content %}
<main class="container py-5"><div class="row justify-content-center"><div class="col-md-8 col-lg-6">
  <div class="card auth-card"><div class="card-body p-4 p-md-5">
    <h1 class="h3 mb-4 text-center">Create your account</h1>
    <form method="post" novalidate>{% csrf_token %}
      {% for field in form %}
        <div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.help_text %}<div class="form-text">{{ field.help_text|safe }}</div>{% endif %}{% for error in field.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}</div>
      {% endfor %}
      <button class="btn btn-primary w-100" type="submit">Create account</button>
    </form>
  </div></div>
</div></div></main>
{% endblock %}
