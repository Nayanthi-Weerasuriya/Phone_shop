{% extends 'blog/base.html' %} 

{% block content %}

    <h1>✍️ Enter Your Post</h1>
    <form method="post" action="{% url 'create' %}">
        {% csrf_token %}
        
        <div class="mb-3">
            <label for="title" class="form-label">Title:</label>
            <input 
                type="text" 
                name="title" 
                id="title" 
                class="form-control" 
                required
            >
        </div>

        <div class="mb-3">
            <label for="category" class="form-label">Category:</label>
            <input 
                type="text" 
                name="category" 
                id="category" 
                class="form-control"
            >
        </div>

        <div class="mb-3">
            <label for="content" class="form-label">Content:</label>
            <textarea 
                name="content" 
                id="content" 
                class="form-control" 
                rows="8" 
                required
            ></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Publish Post</button>
        
    </form>

{% endblock %}
